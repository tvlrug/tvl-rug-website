<script type="module">

  import {
    requireResourceAccess,
    logout
  } from '../js/auth.js?v=3';

  const allowed =
    await requireResourceAccess(
      'MEETING_PAPERS'
    );

  if (allowed) {

    const logoutButton =
      document.getElementById(
        'logout-button'
      );

    if (logoutButton) {

      logoutButton.addEventListener(
        'click',
        logout
      );

    }

  }

</script>
