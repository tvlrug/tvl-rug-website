<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members Login | TVL-RUG</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/site.css">
</head>

<body>

  <!-- Use your existing navbar here -->

  <main>
    <section class="py-5 bg-light border-bottom">
      <div class="container">
        <h1 class="fw-bold">Members Login</h1>
        <p class="text-muted mb-0">
          Sign in to access the TVL-RUG Members Hub.
        </p>
      </div>
    </section>

    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5">

            <div class="card shadow-sm border-0">
              <div class="card-body p-4 p-md-5">

                <h2 class="h4 mb-4">Sign in</h2>

                <div
                  id="login-error"
                  class="alert alert-danger d-none"
                  role="alert">
                </div>

                <form id="login-form">

                  <div class="mb-3">
                    <label for="email" class="form-label">
                      Email address
                    </label>

                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      autocomplete="email"
                      required
                    >
                  </div>

                  <div class="mb-4">
                    <label for="password" class="form-label">
                      Password
                    </label>

                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      autocomplete="current-password"
                      required
                    >
                  </div>

                  <button
                    type="submit"
                    class="btn btn-danger w-100"
                    id="login-button">

                    Sign in
                  </button>

                </form>

              </div>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { supabase } from '/js/auth.js';

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const button = document.getElementById('login-button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      errorBox.classList.add('d-none');
      button.disabled = true;
      button.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        errorBox.textContent = 'Unable to sign in. Check your email and password.';
        errorBox.classList.remove('d-none');

        button.disabled = false;
        button.textContent = 'Sign in';

        return;
      }

      window.location.href = '/members.html';
    });
  </script>

</body>
</html>
